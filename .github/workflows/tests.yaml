name: Unit Tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    # Matrix policy: test only versions that still get security fixes.
    #   Laravel: https://laravelversions.com/en
    #   PHP:     https://www.php.net/supported-versions.php
    # Laravel 13 needs PHP 8.3+, so PHP 8.2 + Laravel 13 is excluded.
    # Last reviewed: 2026-11-16
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: [12.*, 13.*]
        exclude:
          - php: '8.2'
            laravel: 13.*

    name: Unit Tests - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, php-xml, sqlite3
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run test suite
        run: composer run-script test